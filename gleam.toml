name = "mungo"
target = "erlang"
version = "0.27.0"

description = "A MongoDB driver for Gleam (formerly gleam_mongo)"
gleam = ">= 1.4.0"
licences = ["Apache-2.0"]
links = [
  { title = "Gleam", href = "https://gleam.run" },
  { title = "MongoDB", href = "https://www.mongodb.com" },
  { title = "bison", href = "https://hexdocs.pm/bison" },
]
repository = { type = "github", user = "massivefermion", repo = "mungo" }

internal_modules = ["mungo/tcp", "mungo/scram", "mungo/cursor", "mungo/client"]

[dependencies]
bison = { path = "/Users/aurynengel/coding/bison" }
gleam_crypto = "~> 1.6"
gleam_erlang = "~> 1.3"
gleam_otp = "~> 1.2"
gleam_stdlib = "~> 1.0"
mug = "~> 3.1"
gleam_deque = ">= 1.0.0 and < 2.0.0"
gleam_yielder = ">= 1.1.0 and < 2.0.0"

[dev-dependencies]
gleeunit = "~> 1.2"
testcontainer = { version = ">= 1.0.0 and < 2.0.0" }
testcontainer_formulas = { version = ">= 1.0.0 and < 2.0.0" }
